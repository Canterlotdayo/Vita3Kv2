name: Build Vita3K Windows & macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install vcpkg and dependencies
        shell: cmd
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          call C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install zlib:x64-windows-static-md boost-system:x64-windows-static-md boost-filesystem:x64-windows-static-md boost-program-options:x64-windows-static-md boost-icl:x64-windows-static-md boost-variant:x64-windows-static-md curl:x64-windows-static-md openssl:x64-windows-static-md

      - name: Setup MSVC and build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake Configure
        shell: cmd
        run: cmake --preset windows-ninja -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: CMake Build
        run: cmake --build --preset windows-ninja-relwithdebinfo --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita3k-windows-${{ steps.sha.outputs.short }}
          path: build/windows-ninja/bin/RelWithDebInfo/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    name: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: brew install boost cmake ninja ccache molten-vk

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: vita3k-macos
          max-size: 1G

      - name: CMake Configure
        run: |
          cmake --preset macos-ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: CMake Build
        run: cmake --build --preset macos-ninja-relwithdebinfo --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita3k-macos-${{ steps.sha.outputs.short }}
          path: build/macos-ninja/bin/RelWithDebInfo/
          retention-days: 30
